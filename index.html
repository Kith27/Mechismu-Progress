<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FSAE EV · Team Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0D12; --s1:#111318; --s2:#181B23; --s3:#1E2230;
  --border:#23273A; --border2:#2D3347;
  --acc:#C8F400; --acc2:#7DFFB3; --acc3:#4FC3F7;
  --warn:#FF6B4A; --warn2:#FFB547;
  --muted:#3E4460; --muted2:#5A6180;
  --text:#DDE3F5; --text2:#7B84A3; --text3:#4A5068;
  --mono:'JetBrains Mono',monospace;
  --sans:'Inter',sans-serif;
  --r:8px; --r2:12px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.6;min-height:100vh}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit}
input,textarea,select{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ── TOPBAR ── */
#topbar{
  position:sticky;top:0;z-index:200;
  background:rgba(11,13,18,.92);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  display:grid;grid-template-columns:auto 1fr auto auto auto;
  align-items:center;gap:16px;padding:0 20px;height:52px;
}
.tb-brand{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--acc);letter-spacing:.08em;white-space:nowrap}
.tb-race{display:flex;flex-direction:column;gap:3px;min-width:160px}
.tb-race-label{font-family:var(--mono);font-size:9px;color:var(--muted2);letter-spacing:.12em;text-transform:uppercase}
.tb-bar-track{height:4px;background:var(--border2);border-radius:99px;overflow:hidden}
.tb-bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .6s ease}
.tb-stats{display:flex;gap:20px;align-items:center}
.tb-stat{display:flex;flex-direction:column;align-items:center;gap:1px}
.tb-stat-v{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--acc);line-height:1}
.tb-stat-k{font-family:var(--mono);font-size:8px;color:var(--muted2);letter-spacing:.1em;text-transform:uppercase}
.sync-pill{font-family:var(--mono);font-size:10px;padding:3px 9px;border-radius:99px;white-space:nowrap;transition:all .3s}
.sync-pill.ok{background:rgba(125,255,179,.08);color:var(--acc2);border:1px solid rgba(125,255,179,.2)}
.sync-pill.saving{background:rgba(200,244,0,.08);color:var(--acc);border:1px solid rgba(200,244,0,.2)}
.sync-pill.err{background:rgba(255,107,74,.08);color:var(--warn);border:1px solid rgba(255,107,74,.2)}
.sync-pill.uncfg{background:rgba(62,68,96,.15);color:var(--muted2);border:1px solid var(--border)}
.tb-right{display:flex;align-items:center;gap:8px}
.mode-chip{font-family:var(--mono);font-size:9px;font-weight:700;padding:3px 8px;border-radius:99px;letter-spacing:.1em;text-transform:uppercase}
.mode-chip.edit{background:rgba(200,244,0,.12);color:var(--acc);border:1px solid rgba(200,244,0,.25)}
.mode-chip.view{background:rgba(79,195,247,.08);color:var(--acc3);border:1px solid rgba(79,195,247,.2)}
.mode-btn{padding:5px 13px;border-radius:var(--r);font-size:11px;font-weight:600;border:1px solid var(--border2);color:var(--text2);transition:all .2s;white-space:nowrap}
.mode-btn:hover{border-color:var(--acc);color:var(--acc)}
.setup-btn{padding:5px 10px;border-radius:var(--r);font-size:11px;border:1px solid var(--border);color:var(--muted2);transition:all .2s}
.setup-btn:hover{border-color:var(--border2);color:var(--text2)}

/* ── LAYOUT ── */
#shell{display:flex;min-height:calc(100vh - 52px)}

/* ── SIDEBAR ── */
#sidebar{
  width:210px;min-width:210px;flex-shrink:0;
  background:var(--s1);border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  position:sticky;top:52px;height:calc(100vh - 52px);overflow-y:auto;
}
.sb-section{padding:16px 0 4px}
.sb-label{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.15em;text-transform:uppercase;padding:0 14px 6px}
.sb-div{
  display:flex;align-items:center;gap:9px;padding:8px 14px;
  cursor:pointer;border-left:2px solid transparent;transition:all .15s;
}
.sb-div:hover{background:var(--s2)}
.sb-div.active{background:rgba(200,244,0,.05);border-left-color:var(--acc)}
.sb-div-icon{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.sb-div-name{font-size:12px;font-weight:500;flex:1;line-height:1.25}
.sb-div-pct{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--acc2)}
.sb-sep{height:1px;background:var(--border);margin:8px 14px}

/* ── MAIN TABS ── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.main-tabs{
  display:flex;gap:0;
  border-bottom:1px solid var(--border);
  background:var(--s1);flex-shrink:0;
}
.main-tab{
  padding:14px 28px;font-size:13px;font-weight:600;color:var(--text2);
  border-bottom:2px solid transparent;transition:all .2s;letter-spacing:.01em;
  display:flex;align-items:center;gap:8px;
}
.main-tab:hover{color:var(--text)}
.main-tab.active{color:var(--text);border-bottom-color:var(--acc)}
.main-tab .tab-icon{font-size:15px}
.main-content{flex:1;overflow-y:auto;padding:24px}

/* ── PERIOD NAV ── */
.period-nav{
  display:flex;align-items:center;gap:10px;margin-bottom:22px;flex-wrap:wrap;
}
.pnav-btn{
  padding:6px 12px;border-radius:var(--r);border:1px solid var(--border2);
  color:var(--text2);font-size:12px;transition:all .2s;
}
.pnav-btn:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
.pnav-btn:disabled{opacity:.3;cursor:not-allowed}
.pnav-current{
  font-family:var(--mono);font-size:12px;font-weight:600;color:var(--text);
  padding:6px 16px;background:var(--s2);border:1px solid var(--border2);border-radius:var(--r);
  white-space:nowrap;
}
.pnav-current.now{border-color:rgba(200,244,0,.3);color:var(--acc)}
.pnav-home{
  padding:6px 13px;border-radius:var(--r);border:1px solid rgba(200,244,0,.25);
  color:var(--acc);font-size:11px;font-weight:600;transition:all .2s;
}
.pnav-home:hover{background:rgba(200,244,0,.08)}

/* ── OVERVIEW CARDS ── */
.ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.ov-card{
  background:var(--s1);border:1px solid var(--border);border-radius:var(--r2);
  padding:16px;cursor:pointer;transition:border-color .2s,transform .15s;
}
.ov-card:hover{border-color:var(--acc);transform:translateY(-1px)}
.ov-card-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:11px}
.ov-icon{font-size:22px;line-height:1}
.ov-name{font-size:13px;font-weight:600;flex:1;line-height:1.3}
.ov-pct{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--acc);line-height:1}
.ov-bar-track{height:5px;background:var(--border2);border-radius:99px;overflow:hidden;margin-bottom:9px}
.ov-bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .5s}
.ov-bar-fill.lo{background:linear-gradient(90deg,var(--warn),var(--warn2))}
.ov-meta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;color:var(--text2)}

/* ── DIVISION DETAIL ── */
.dv-header{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.dv-icon{font-size:28px}
.dv-title{font-size:18px;font-weight:700}
.dv-sub{font-size:11px;color:var(--text2);margin-top:2px}
.dv-back{margin-left:auto;padding:6px 13px;border:1px solid var(--border2);border-radius:var(--r);font-size:11px;color:var(--text2);transition:all .2s}
.dv-back:hover{border-color:var(--acc);color:var(--acc)}

/* ── INNER TABS (Tasks / Meeting) ── */
.inner-tabs{display:flex;gap:4px;margin-bottom:18px}
.inner-tab{
  padding:7px 18px;border-radius:99px;font-size:12px;font-weight:600;
  color:var(--text2);border:1px solid transparent;transition:all .2s;
}
.inner-tab:hover{color:var(--text)}
.inner-tab.active{background:var(--s2);border-color:var(--border2);color:var(--text)}

/* ── CARD ── */
.card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r2);padding:18px;margin-bottom:14px}
.card-title{font-family:var(--mono);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--muted2);margin-bottom:14px}

/* ── PROGRESS RING AREA ── */
.prog-summary{display:flex;align-items:center;gap:20px;margin-bottom:12px}
.prog-bar-wrap{flex:1}
.prog-bar-h{display:flex;justify-content:space-between;margin-bottom:5px}
.prog-bar-label{font-size:11px;color:var(--text2)}
.prog-bar-pct{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--acc)}
.prog-track{height:8px;background:var(--border2);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .5s}
.prog-fill.lo{background:linear-gradient(90deg,var(--warn),var(--warn2))}
.prog-chips{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap}
.prog-chip{font-family:var(--mono);font-size:11px;color:var(--text2)}

/* ── TARGETS ── */
.tgt-list{display:flex;flex-direction:column;gap:7px}
.tgt-row{
  display:flex;align-items:flex-start;gap:10px;padding:9px 11px;
  border-radius:6px;background:var(--s2);border:1px solid transparent;transition:border-color .15s;
}
.tgt-row:hover{border-color:var(--border2)}
.tgt-row.done .tgt-text{text-decoration:line-through;color:var(--text3)}
.tgt-check{
  width:17px;height:17px;border-radius:4px;flex-shrink:0;
  border:2px solid var(--border2);margin-top:2px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .15s;
}
.tgt-check.on{background:var(--acc);border-color:var(--acc)}
.tgt-check.on::after{content:'✓';font-size:10px;color:#000;font-weight:800}
.tgt-text{flex:1;font-size:13px;line-height:1.4}
.tgt-del{font-size:14px;color:var(--muted);padding:1px 4px;flex-shrink:0;transition:color .15s;line-height:1.5}
.tgt-del:hover{color:var(--warn)}
.add-row{display:flex;gap:8px;margin-top:10px}
.add-inp{
  flex:1;background:var(--s2);border:1px solid var(--border2);
  color:var(--text);padding:8px 11px;border-radius:6px;font-size:13px;outline:none;transition:border-color .15s;
}
.add-inp:focus{border-color:var(--acc)}
.add-btn{padding:8px 15px;border-radius:6px;background:rgba(200,244,0,.1);border:1px solid rgba(200,244,0,.25);color:var(--acc);font-size:12px;font-weight:600;transition:all .2s;white-space:nowrap}
.add-btn:hover{background:rgba(200,244,0,.18)}

/* ── MEETING ── */
.mtg-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.mtg-field label{font-family:var(--mono);font-size:10px;color:var(--muted2);letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:6px}
.mtg-input{
  width:100%;background:var(--s2);border:1px solid var(--border2);
  color:var(--text);padding:8px 11px;border-radius:6px;font-size:13px;outline:none;transition:border-color .15s;
}
.mtg-input:focus{border-color:var(--acc)}
.mtg-input:disabled{opacity:.6;cursor:default}
.mtg-ta{min-height:72px;resize:vertical;line-height:1.5}
.mtg-full{grid-column:1/-1}
.save-btn{padding:8px 20px;border-radius:6px;background:var(--acc);color:#000;font-size:12px;font-weight:700;letter-spacing:.04em;transition:all .2s;margin-top:4px}
.save-btn:hover{background:#d4ff20}
.save-btn:disabled{opacity:.5;cursor:not-allowed}
.saved-chip{font-family:var(--mono);font-size:10px;color:var(--acc2);margin-top:6px;opacity:0;transition:opacity .3s}
.saved-chip.show{opacity:1}

/* ── HISTORY ── */
.hist-item{border:1px solid var(--border);border-radius:var(--r);margin-bottom:9px;overflow:hidden}
.hist-head{display:flex;align-items:center;gap:10px;padding:9px 13px;background:var(--s2);cursor:pointer;user-select:none}
.hist-head-label{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--text2);flex:1}
.hist-head-pct{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--acc)}
.hist-chevron{color:var(--muted2);font-size:11px;transition:transform .2s}
.hist-chevron.open{transform:rotate(90deg)}
.hist-body{padding:13px;display:none}
.hist-body.open{display:block}
.hist-tgt{font-size:12px;color:var(--text2);padding:2px 0}
.hist-tgt.done{color:var(--acc2)}
.hist-tgt.done::before{content:'✓  '}
.hist-tgt:not(.done)::before{content:'○  '}
.hist-mtg{margin-top:10px;padding:10px;background:var(--bg);border-radius:5px;border-left:2px solid var(--border2)}
.hist-mtg-label{font-family:var(--mono);font-size:9px;color:var(--muted2);letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
.hist-mtg-row{font-size:12px;color:var(--text2);margin-bottom:4px}
.hist-mtg-row strong{color:var(--text);font-weight:600}
.empty-hist{text-align:center;padding:28px;font-size:13px;color:var(--muted2)}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--s1);border:1px solid var(--border2);border-radius:var(--r2);padding:28px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto}
.modal h2{font-size:17px;font-weight:700;margin-bottom:4px}
.modal-sub{font-size:12px;color:var(--text2);margin-bottom:18px;line-height:1.6}
.modal-warn{background:rgba(255,107,74,.07);border:1px solid rgba(255,107,74,.2);border-radius:6px;padding:9px 13px;font-size:12px;color:var(--warn);margin-bottom:16px;line-height:1.5}
.mf{margin-bottom:13px}
.mf label{font-family:var(--mono);font-size:9px;color:var(--muted2);letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:5px}
.mf input{width:100%;background:var(--s2);border:1px solid var(--border2);color:var(--text);padding:8px 11px;border-radius:6px;font-size:13px;outline:none;transition:border-color .15s}
.mf input:focus{border-color:var(--acc)}
.mf-help{font-size:11px;color:var(--muted2);margin-top:4px}
.mf-help a{color:var(--acc2)}
.modal-actions{display:flex;gap:10px;margin-top:20px}
.btn-acc{flex:1;padding:9px 18px;border-radius:6px;background:var(--acc);color:#000;font-weight:700;font-size:12px;transition:all .2s}
.btn-acc:hover{background:#d4ff20}
.btn-acc:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{padding:9px 18px;border-radius:6px;border:1px solid var(--border2);color:var(--text2);font-size:12px;transition:all .2s}
.btn-ghost:hover{border-color:var(--acc);color:var(--acc)}

/* ── SPINNER ── */
.spin{display:inline-block;width:11px;height:11px;border:2px solid rgba(200,244,0,.15);border-top-color:var(--acc);border-radius:50%;animation:rot .7s linear infinite;vertical-align:middle;margin-right:4px}
@keyframes rot{to{transform:rotate(360deg)}}

/* ── TOAST ── */
#toast{position:fixed;bottom:22px;right:22px;z-index:999;background:var(--s2);border:1px solid var(--acc);color:var(--text);padding:9px 15px;border-radius:var(--r);font-size:12px;font-family:var(--mono);transform:translateY(50px);opacity:0;transition:all .3s;pointer-events:none;max-width:300px}
#toast.show{transform:translateY(0);opacity:1}
#toast.err{border-color:var(--warn);color:var(--warn)}

@media(max-width:700px){#sidebar{display:none}.main-content{padding:14px}.ov-grid{grid-template-columns:1fr}.mtg-grid{grid-template-columns:1fr}.tb-stats{display:none}}
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <div class="tb-brand">⚡ FSAE EV</div>
  <div class="tb-race">
    <div class="tb-race-label">Weekly completion</div>
    <div class="tb-bar-track"><div class="tb-bar-fill" id="tb-bar" style="width:0%"></div></div>
  </div>
  <div class="tb-stats" id="tb-stats"></div>
  <span class="sync-pill uncfg" id="sync-pill">⚙ Not configured</span>
  <div class="tb-right">
    <span class="mode-chip view" id="mode-chip">VIEW</span>
    <button class="mode-btn" id="mode-btn">→ Lead Edit</button>
    <button class="setup-btn" id="setup-btn" title="GitHub Setup">⚙</button>
  </div>
</div>

<div id="shell">
  <!-- SIDEBAR -->
  <nav id="sidebar">
    <div class="sb-section">
      <div class="sb-label">Divisions</div>
      <div id="sb-divs"></div>
    </div>
  </nav>

  <!-- MAIN -->
  <div id="main">
    <!-- MAIN TABS -->
    <div class="main-tabs">
      <button class="main-tab active" data-tab="weekly" id="tab-weekly">
        <span class="tab-icon">📅</span> Weekly
      </button>
      <button class="main-tab" data-tab="monthly" id="tab-monthly">
        <span class="tab-icon">🗓️</span> Monthly
      </button>
    </div>
    <div class="main-content" id="main-content"></div>
  </div>
</div>

<div id="toast"></div>

<script>
// ═══════════════ CONFIG ═══════════════
const DIVS = [
  {id:'chassis',    name:'Chassis',                     icon:'🏗️'},
  {id:'drivetrain', name:'Drivetrain',                  icon:'⚙️'},
  {id:'suspension', name:'Steering & Suspension',       icon:'🔧'},
  {id:'brakes',     name:'Brakes',                      icon:'🛑'},
  {id:'battery',    name:'Battery Pack & BMS',          icon:'🔋'},
  {id:'motor',      name:'Motor & Motor Controller',    icon:'⚡'},
  {id:'safety',     name:'Safety Circuits & LV System', icon:'🛡️'},
];

// ═══════════════ WEEK / MONTH UTILS ═══════════════
function getWeekKey(d=new Date()){
  const u=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  const dow=u.getUTCDay()||7; u.setUTCDate(u.getUTCDate()+4-dow);
  const ys=new Date(Date.UTC(u.getUTCFullYear(),0,1));
  const wn=Math.ceil(((u-ys)/864e5+1)/7);
  return `${u.getUTCFullYear()}-W${String(wn).padStart(2,'0')}`;
}
function getMonthKey(d=new Date()){
  return `${d.getFullYear()}-M${String(d.getMonth()+1).padStart(2,'0')}`;
}
function weekLabel(k){
  const [yr,w]=k.split('-W');
  const d=new Date(Date.UTC(+yr,0,1)); const dow=d.getUTCDay()||7;
  const s1=new Date(Date.UTC(+yr,0,1+(dow<=4?1-dow:8-dow)));
  const ws=new Date(s1.getTime()+(+w-1)*7*864e5);
  const we=new Date(ws.getTime()+6*864e5);
  const f=x=>x.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  return `Week ${w}  ·  ${f(ws)} – ${f(we)} ${yr}`;
}
function monthLabel(k){
  const [yr,m]=k.split('-M');
  const d=new Date(+yr,+m-1,1);
  return d.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
}
function shiftWeek(k,d){
  const [yr,w]=k.split('-W');
  const base=new Date(Date.UTC(+yr,0,1)); const dow=base.getUTCDay()||7;
  const s1=new Date(Date.UTC(+yr,0,1+(dow<=4?1-dow:8-dow)));
  const ws=new Date(s1.getTime()+(+w-1)*7*864e5);
  ws.setUTCDate(ws.getUTCDate()+d*7);
  return getWeekKey(ws);
}
function shiftMonth(k,d){
  const [yr,m]=k.split('-M');
  const nd=new Date(+yr,+m-1+d,1);
  return getMonthKey(nd);
}

// ═══════════════ GITHUB / WORKER ═══════════════
function getCfg(){return {workerUrl:'https://fsaetracker.saaketharamk2006.workers.dev',leadPw:localStorage.getItem('fsae_lead_pw')||'mechismu27'};}
function setCfg(c){localStorage.setItem('fsae_cfg',JSON.stringify(c));}

async function apiLoad(){
  const cfg=getCfg();
  if(!cfg?.workerUrl){
    // fallback: try same-origin data.json for public view
    try{const r=await fetch('./data.json');if(r.ok)return r.json();}catch{}
    return {};
  }
  const r=await fetch(cfg.workerUrl+'/load');
  if(!r.ok) throw new Error('Load failed: '+r.status);
  return r.json();
}
async function apiSave(data){
  const cfg=getCfg();
  if(!cfg?.workerUrl) throw new Error('Worker not configured');
  const r=await fetch(cfg.workerUrl+'/save',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({password:cfg.leadPw,data})
  });
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error||r.status);}
  return r.json();
}

// ═══════════════ STATE ═══════════════
const S={
  mode:'view',
  tab:'weekly',          // weekly | monthly
  view:'overview',       // overview | division
  divId:null,
  innerTab:{},           // divId -> tasks | meeting
  weekKey:getWeekKey(),
  monthKey:getMonthKey(),
  data:{},
  sync:'uncfg',
};

// ═══════════════ DATA HELPERS ═══════════════
function getEntry(divId, periodKey){
  if(!S.data[divId]) S.data[divId]={};
  if(!S.data[divId][periodKey]) S.data[divId][periodKey]={
    targets:[],
    meeting:{date:'',attendees:'',discussion:'',decisions:''}
  };
  // ensure meeting object exists on old records
  if(!S.data[divId][periodKey].meeting)
    S.data[divId][periodKey].meeting={date:'',attendees:'',discussion:'',decisions:''};
  return S.data[divId][periodKey];
}
function completion(entry){
  if(!entry?.targets?.length) return null;
  return Math.round(entry.targets.filter(t=>t.done).length/entry.targets.length*100);
}
function currentKey(){return S.tab==='weekly'?S.weekKey:S.monthKey;}

// ═══════════════ SAVE QUEUE ═══════════════
let _st=null;
function queueSave(){clearTimeout(_st);_st=setTimeout(flushSave,1400);}
async function flushSave(){
  setSyncStatus('saving');
  try{await apiSave(S.data);setSyncStatus('ok');toast('✓ Saved to GitHub');}
  catch(e){setSyncStatus('err');toast('Save failed: '+e.message,true);}
}
function setSyncStatus(s){
  S.sync=s;
  const el=document.getElementById('sync-pill');
  if(!el)return;
  const map={uncfg:'⚙ Not configured',ok:'✓ Synced',saving:'<span class="spin"></span>Saving…',err:'✗ Sync error'};
  el.innerHTML=map[s];el.className='sync-pill '+s;
}

// ═══════════════ RENDER ═══════════════
function render(){renderTopbar();renderSidebar();renderContent();}

function renderTopbar(){
  const {data,weekKey,mode}=S;
  let tot=0,dn=0;
  DIVS.forEach(d=>{const e=data[d.id]?.[weekKey];if(e?.targets?.length){tot+=e.targets.length;dn+=e.targets.filter(t=>t.done).length;}});
  const pct=tot>0?Math.round(dn/tot*100):0;
  document.getElementById('tb-bar').style.width=pct+'%';
  document.getElementById('tb-stats').innerHTML=`
    <div class="tb-stat"><div class="tb-stat-v">${pct}%</div><div class="tb-stat-k">Done</div></div>
    <div class="tb-stat"><div class="tb-stat-v">${dn}/${tot}</div><div class="tb-stat-k">Tasks</div></div>`;
  setSyncStatus(S.sync);
  document.getElementById('mode-chip').textContent=mode==='edit'?'EDIT':'VIEW';
  document.getElementById('mode-chip').className='mode-chip '+(mode==='edit'?'edit':'view');
  document.getElementById('mode-btn').textContent=mode==='edit'?'→ View Mode':'→ Lead Edit';
  document.getElementById('mode-btn').onclick=handleModeSwitch;
  document.getElementById('setup-btn').onclick=()=>showSetup();
}

function handleModeSwitch(){
  if(S.mode==='edit'){S.mode='view';render();return;}
  const cfg=getCfg();
  if(!cfg?.workerUrl){showSetup();return;}
  const pw=prompt('Lead password:');
  if(pw===null)return;
  if(pw===(cfg.leadPw||'fsae2025')){S.mode='edit';render();}
  else toast('Incorrect password',true);
}

function renderSidebar(){
  const c=document.getElementById('sb-divs');
  c.innerHTML=DIVS.map(d=>{
    const e=S.data[d.id]?.[currentKey()];
    const pct=completion(e);
    const active=S.view==='division'&&S.divId===d.id;
    return `<div class="sb-div ${active?'active':''}" data-div="${d.id}">
      <span class="sb-div-icon">${d.icon}</span>
      <span class="sb-div-name">${d.name}</span>
      <span class="sb-div-pct">${pct!==null?pct+'%':'—'}</span>
    </div>`;
  }).join('');
  c.querySelectorAll('.sb-div').forEach(el=>el.addEventListener('click',()=>{
    S.view='division';S.divId=el.dataset.div;render();
  }));
}

function renderContent(){
  // main tab buttons
  document.querySelectorAll('.main-tab').forEach(btn=>{
    btn.classList.toggle('active',btn.dataset.tab===S.tab);
    btn.onclick=()=>{S.tab=btn.dataset.tab;S.view='overview';render();};
  });
  const mc=document.getElementById('main-content');
  mc.innerHTML=S.view==='overview'?buildOverview():buildDivision();
  attachEvents();
}

// ═══════════════ OVERVIEW ═══════════════
function buildOverview(){
  const k=currentKey();
  const isWeek=S.tab==='weekly';
  return `
    <div style="margin-bottom:20px">
      <h1 style="font-size:20px;font-weight:700">${isWeek?'Weekly Overview':'Monthly Overview'}</h1>
      <p style="color:var(--text2);font-size:12px;margin-top:3px">${isWeek?weekLabel(S.weekKey):monthLabel(S.monthKey)}</p>
    </div>
    ${buildPeriodNav()}
    <div class="ov-grid">
      ${DIVS.map(d=>{
        const e=S.data[d.id]?.[k]||{targets:[]};
        const tot=e.targets.length,dn=e.targets.filter(t=>t.done).length;
        const pct=tot>0?Math.round(dn/tot*100):0;
        const hasMtg=e.meeting&&(e.meeting.date||e.meeting.discussion);
        return `<div class="ov-card" data-div="${d.id}">
          <div class="ov-card-top">
            <span class="ov-icon">${d.icon}</span>
            <span class="ov-name">${d.name}</span>
            <span class="ov-pct">${tot>0?pct+'%':'—'}</span>
          </div>
          <div class="ov-bar-track"><div class="ov-bar-fill${pct<40&&tot>0?' lo':''}" style="width:${pct}%"></div></div>
          <div class="ov-meta">
            <span>${dn}/${tot} tasks</span>
            <span>${hasMtg?'📋 meeting logged':''}</span>
          </div>
        </div>`;
      }).join('')}
    </div>`;
}

// ═══════════════ DIVISION DETAIL ═══════════════
function buildDivision(){
  const div=DIVS.find(d=>d.id===S.divId);
  const k=currentKey();
  const isWeek=S.tab==='weekly';
  const entry=getEntry(S.divId,k);
  const itab=S.innerTab[S.divId]||'tasks';
  const tot=entry.targets.length,dn=entry.targets.filter(t=>t.done).length;
  const pct=tot>0?Math.round(dn/tot*100):0;
  const isEdit=S.mode==='edit';

  // history
  const hkeys=Object.keys(S.data[S.divId]||{})
    .filter(hk=>hk!==k&&hk.includes(isWeek?'-W':'-M'))
    .sort((a,b)=>b.localeCompare(a)).slice(0,10);

  const histHTML=hkeys.length?hkeys.map(hk=>{
    const e=getEntry(S.divId,hk);
    const ht=e.targets.length,hd=e.targets.filter(t=>t.done).length;
    const hp=ht>0?Math.round(hd/ht*100):0;
    const mtg=e.meeting||{};
    const hasMtg=mtg.date||mtg.attendees||mtg.discussion||mtg.decisions;
    return `<div class="hist-item">
      <div class="hist-head" data-hk="${hk}">
        <span class="hist-head-label">${isWeek?weekLabel(hk):monthLabel(hk)}</span>
        <span class="hist-head-pct">${ht>0?hp+'%':'—'}</span>
        <span class="hist-chevron">▶</span>
      </div>
      <div class="hist-body" id="hb-${hk.replace(/[^a-z0-9]/gi,'_')}">
        <div style="margin-bottom:${hasMtg?'12':'0'}px">
          ${e.targets.map(t=>`<div class="hist-tgt ${t.done?'done':''}">${esc(t.text)}</div>`).join('')||'<div style="color:var(--muted2);font-size:12px">No tasks recorded.</div>'}
        </div>
        ${hasMtg?`<div class="hist-mtg">
          <div class="hist-mtg-label">Meeting</div>
          ${mtg.date?`<div class="hist-mtg-row"><strong>Date:</strong> ${esc(mtg.date)}</div>`:''}
          ${mtg.attendees?`<div class="hist-mtg-row"><strong>Attendees:</strong> ${esc(mtg.attendees)}</div>`:''}
          ${mtg.discussion?`<div class="hist-mtg-row"><strong>Discussion:</strong> ${esc(mtg.discussion)}</div>`:''}
          ${mtg.decisions?`<div class="hist-mtg-row"><strong>Decisions:</strong> ${esc(mtg.decisions)}</div>`:''}
        </div>`:''}
      </div>
    </div>`;
  }).join(''):`<div class="empty-hist">No ${isWeek?'past weeks':'past months'} recorded yet.</div>`;

  return `
    <div class="dv-header">
      <span class="dv-icon">${div.icon}</span>
      <div>
        <div class="dv-title">${div.name}</div>
        <div class="dv-sub">${isWeek?weekLabel(k):monthLabel(k)}</div>
      </div>
      <button class="dv-back" id="dv-back">← Back</button>
    </div>
    ${buildPeriodNav()}

    <!-- PROGRESS -->
    <div class="card">
      <div class="card-title">${isWeek?'Week':'Month'} Progress</div>
      <div class="prog-summary">
        <div class="prog-bar-wrap">
          <div class="prog-bar-h">
            <span class="prog-bar-label">Task completion</span>
            <span class="prog-bar-pct">${pct}%</span>
          </div>
          <div class="prog-track"><div class="prog-fill${pct<40&&tot>0?' lo':''}" style="width:${pct}%"></div></div>
          <div class="prog-chips">
            <span class="prog-chip">✅ ${dn} done</span>
            <span class="prog-chip">○ ${tot-dn} pending</span>
            <span class="prog-chip">📋 ${tot} total</span>
          </div>
        </div>
      </div>
    </div>

    <!-- INNER TABS -->
    <div class="inner-tabs">
      <button class="inner-tab ${itab==='tasks'?'active':''}" data-itab="tasks">📋 Tasks</button>
      <button class="inner-tab ${itab==='meeting'?'active':''}" data-itab="meeting">🗣️ Meeting</button>
      <button class="inner-tab ${itab==='history'?'active':''}" data-itab="history">🕒 History</button>
    </div>

    <!-- TASKS PANEL -->
    <div id="panel-tasks" style="display:${itab==='tasks'?'block':'none'}">
      <div class="card">
        <div class="card-title">${isWeek?'Weekly':'Monthly'} Tasks</div>
        <div class="tgt-list" id="tgt-list">
          ${entry.targets.length?entry.targets.map((t,i)=>`
            <div class="tgt-row ${t.done?'done':''}" data-i="${i}">
              <div class="tgt-check ${t.done?'on':''}" data-check="${i}"></div>
              <span class="tgt-text">${esc(t.text)}</span>
              ${isEdit?`<button class="tgt-del" data-del="${i}">✕</button>`:''}
            </div>`).join('')
          :`<div style="text-align:center;padding:18px;color:var(--muted2);font-size:13px">${isEdit?'No tasks yet — add one below.':'No tasks set for this period.'}</div>`}
        </div>
        ${isEdit?`<div class="add-row">
          <input class="add-inp" id="add-inp" placeholder="Add a task… (Enter to add)" maxlength="250">
          <button class="add-btn" id="add-btn">+ Add</button>
        </div>`:''}
      </div>
    </div>

    <!-- MEETING PANEL -->
    <div id="panel-meeting" style="display:${itab==='meeting'?'block':'none'}">
      <div class="card">
        <div class="card-title">Meeting Log</div>
        <div class="mtg-grid">
          <div class="mtg-field">
            <label>Date of Meeting</label>
            <input class="mtg-input" id="mtg-date" type="date" value="${esc(entry.meeting.date)}" ${!isEdit?'disabled':''}>
          </div>
          <div class="mtg-field">
            <label>Attendees</label>
            <input class="mtg-input" id="mtg-attendees" placeholder="e.g. Saaketh, Arjun, Priya…" value="${esc(entry.meeting.attendees)}" ${!isEdit?'disabled':''}>
          </div>
          <div class="mtg-field mtg-full">
            <label>Discussion Points / Agenda</label>
            <textarea class="mtg-input mtg-ta" id="mtg-discussion" placeholder="Key topics discussed…" ${!isEdit?'disabled':''}>${esc(entry.meeting.discussion)}</textarea>
          </div>
          <div class="mtg-field mtg-full">
            <label>Decisions Made</label>
            <textarea class="mtg-input mtg-ta" id="mtg-decisions" placeholder="Decisions reached in this meeting…" ${!isEdit?'disabled':''}>${esc(entry.meeting.decisions)}</textarea>
          </div>
        </div>
        ${isEdit?`<button class="save-btn" id="save-mtg-btn">Save Meeting</button>
        <div class="saved-chip" id="saved-chip">✓ Meeting saved</div>`:''}
      </div>
    </div>

    <!-- HISTORY PANEL -->
    <div id="panel-history" style="display:${itab==='history'?'block':'none'}">
      <div class="card">
        <div class="card-title">Past ${isWeek?'Weeks':'Months'} History</div>
        ${histHTML}
      </div>
    </div>`;
}

// ═══════════════ PERIOD NAV ═══════════════
function buildPeriodNav(){
  const isWeek=S.tab==='weekly';
  const cur=isWeek?S.weekKey:S.monthKey;
  const now=isWeek?getWeekKey():getMonthKey();
  const isNow=cur===now;
  return `<div class="period-nav">
    <button class="pnav-btn" id="pnav-prev">← Prev</button>
    <span class="pnav-current ${isNow?'now':''}">${isWeek?weekLabel(cur):monthLabel(cur)}</span>
    <button class="pnav-btn" id="pnav-next" ${isNow?'disabled':''}>Next →</button>
    ${!isNow?`<button class="pnav-home" id="pnav-home">↩ Current</button>`:''}
  </div>`;
}

// ═══════════════ EVENTS ═══════════════
function attachEvents(){
  // overview cards
  document.querySelectorAll('.ov-card').forEach(el=>el.addEventListener('click',()=>{
    S.view='division';S.divId=el.dataset.div;render();
  }));

  // back
  const back=document.getElementById('dv-back');
  if(back) back.onclick=()=>{S.view='overview';render();};

  // period nav
  const pp=document.getElementById('pnav-prev'),np=document.getElementById('pnav-next'),hp=document.getElementById('pnav-home');
  const isWeek=S.tab==='weekly';
  if(pp) pp.onclick=()=>{isWeek?S.weekKey=shiftWeek(S.weekKey,-1):S.monthKey=shiftMonth(S.monthKey,-1);render();};
  if(np) np.onclick=()=>{isWeek?S.weekKey=shiftWeek(S.weekKey,1):S.monthKey=shiftMonth(S.monthKey,1);render();};
  if(hp) hp.onclick=()=>{isWeek?S.weekKey=getWeekKey():S.monthKey=getMonthKey();render();};

  // inner tabs
  document.querySelectorAll('[data-itab]').forEach(btn=>btn.addEventListener('click',()=>{
    S.innerTab[S.divId]=btn.dataset.itab;render();
  }));

  // task checks
  document.querySelectorAll('[data-check]').forEach(el=>el.addEventListener('click',()=>{
    if(S.mode!=='edit'){toast('Switch to Lead Edit to make changes',true);return;}
    const e=getEntry(S.divId,currentKey());
    e.targets[+el.dataset.check].done=!e.targets[+el.dataset.check].done;
    queueSave();render();
  }));

  // task delete
  document.querySelectorAll('[data-del]').forEach(el=>el.addEventListener('click',()=>{
    if(!confirm('Delete this task?'))return;
    getEntry(S.divId,currentKey()).targets.splice(+el.dataset.del,1);
    queueSave();render();
  }));

  // add task
  const ai=document.getElementById('add-inp'),ab=document.getElementById('add-btn');
  if(ai&&ab){
    const doAdd=()=>{
      const t=ai.value.trim();if(!t)return;
      getEntry(S.divId,currentKey()).targets.push({text:t,done:false});
      queueSave();render();
      setTimeout(()=>{const x=document.getElementById('add-inp');if(x)x.focus();},40);
    };
    ab.onclick=doAdd;ai.onkeydown=e=>{if(e.key==='Enter')doAdd();};
  }

  // save meeting
  const sm=document.getElementById('save-mtg-btn');
  if(sm) sm.onclick=()=>{
    const e=getEntry(S.divId,currentKey());
    e.meeting={
      date:document.getElementById('mtg-date')?.value||'',
      attendees:document.getElementById('mtg-attendees')?.value||'',
      discussion:document.getElementById('mtg-discussion')?.value||'',
      decisions:document.getElementById('mtg-decisions')?.value||'',
    };
    queueSave();renderTopbar();
    const chip=document.getElementById('saved-chip');
    if(chip){chip.classList.add('show');setTimeout(()=>chip.classList.remove('show'),2000);}
    toast('Meeting saved');
  };

  // history accordions
  document.querySelectorAll('[data-hk]').forEach(el=>el.addEventListener('click',()=>{
    const id='hb-'+el.dataset.hk.replace(/[^a-z0-9]/gi,'_');
    const body=document.getElementById(id);
    const ch=el.querySelector('.hist-chevron');
    if(body){body.classList.toggle('open');ch.classList.toggle('open');}
  }));

  // sidebar divs
  renderSidebar();
}

// ═══════════════ SETUP MODAL ═══════════════
function showSetup(){
  const cfg=getCfg()||{};
  const ov=document.createElement('div');
  ov.className='overlay';
  ov.innerHTML=`<div class="modal">
    <h2>⚙️ GitHub Setup</h2>
    <div class="modal-sub">Connect to your Cloudflare Worker so all data is stored in GitHub. Leads only need a password — the PAT stays in the Worker.</div>
    <div class="modal-warn">⚠ Your Worker URL and lead password are stored in this browser only. The GitHub token lives in Cloudflare — no one else can see it.</div>
    <div class="mf">
      <label>Cloudflare Worker URL</label>
      <input id="cfg-url" placeholder="https://fsae-tracker.yourname.workers.dev" value="${esc(cfg.workerUrl||'')}">
      <div class="mf-help">Deploy the Worker from the included <code>worker.js</code> file. See README for steps.</div>
    </div>
    <div class="mf">
      <label>Lead Password</label>
      <input id="cfg-pw" type="password" placeholder="fsae2025" value="${esc(cfg.leadPw||'')}">
      <div class="mf-help">Must match the LEAD_PASSWORD set in your Worker environment variables.</div>
    </div>
    <div class="modal-actions">
      <button class="btn-acc" id="cfg-save">Save & Test Connection</button>
      <button class="btn-ghost" id="cfg-cancel">Cancel</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  ov.querySelector('#cfg-cancel').onclick=()=>ov.remove();
  ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});
  ov.querySelector('#cfg-save').onclick=async()=>{
    const url=ov.querySelector('#cfg-url').value.trim().replace(/\/$/,'');
    const pw=ov.querySelector('#cfg-pw').value;
    if(!url||!pw){toast('Fill in all fields',true);return;}
    const btn=ov.querySelector('#cfg-save');
    btn.disabled=true;btn.innerHTML='<span class="spin"></span>Testing…';
    try{
      setCfg({workerUrl:url,leadPw:pw});
      const d=await apiLoad();
      S.data=d; setSyncStatus('ok');
      ov.remove();toast('✓ Connected!');render();
    }catch(e){
      btn.disabled=false;btn.textContent='Save & Test Connection';
      toast('Connection failed: '+e.message,true);
    }
  };
}

// ═══════════════ UTILS ═══════════════
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(msg,err=false){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className='show'+(err?' err':'');
  clearTimeout(el._t);el._t=setTimeout(()=>el.className='',3000);
}

// ═══════════════ INIT ═══════════════
async function init(){
  render();
  const cfg=getCfg();
  if(cfg?.workerUrl){
    setSyncStatus('saving');
    try{S.data=await apiLoad();setSyncStatus('ok');}
    catch(e){setSyncStatus('err');toast('Load error: '+e.message,true);}
  } else {
    try{const r=await fetch('./data.json');if(r.ok)S.data=await r.json();}catch{}
  }
  render();
}
init();
</script>
</body>
